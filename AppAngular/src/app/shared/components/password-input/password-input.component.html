<div class="password-field">
  <input
    [id]="inputId"
    [name]="name"
    [type]="show ? 'text' : 'password'"
    [value]="value"
    (input)="onInput($event)"
    [placeholder]="placeholder"
    [class.input-error]="hasError" />

  <button
    type="button"
    class="btn-toggle-password"
    (click)="show = !show">

    <i [class]="show ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>

  </button>
</div>
