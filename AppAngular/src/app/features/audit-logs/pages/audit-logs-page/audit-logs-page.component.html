<div class="audit-container">
    <h2>Auditorías</h2>

    <div class="filters">
        <div class="form-group">
            <label>Entidad</label>
            <select [(ngModel)]="entidad" name="entidad">
                <option value="">Seleccioná una entidad</option>
                <option value="PRODUCTO">Producto</option>
                <option value="PROMOCION">Promoción</option>
            </select>
        </div>
        <div class="form-group">
            <label>ID Entidad</label>
            <input type="number" [(ngModel)]="entityId" name="entityId" placeholder="Ej: 1" />
        </div>
        <div class="form-group">
            <label>Fecha desde</label>
            <input type="datetime-local" [(ngModel)]="fechaDesde" name="fechaDesde" />
        </div>
        <div class="form-group">
            <label>Fecha hasta</label>
            <input type="datetime-local" [(ngModel)]="fechaHasta" name="fechaHasta" />
        </div>
        <app-filter-button (filtered)="onFiltrar()" />
        <app-clear-button (cleared)="onLimpiar()" />
    </div>

    <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>

    <table class="audit-table">
        <thead>
            <tr>
                <th>Fecha y hora</th>
                <th>Entidad</th>
                <th>ID Entidad</th>
                <th>Descripción</th>
                <th>Usuario</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngIf="auditLogs.length === 0">
                <td colspan="5" class="empty">No hay registros para mostrar.</td>
            </tr>
            <tr *ngFor="let log of auditLogs">
                <td>{{ log.dateTime | date:'dd/MM/yyyy HH:mm' }}</td>
                <td>{{ log.entityName }}</td>
                <td>{{ log.entityId }}</td>
                <td>{{ log.changeDescription }}</td>
                <td>{{ log.responsibleUser }}</td>
            </tr>
        </tbody>
    </table>
</div>
