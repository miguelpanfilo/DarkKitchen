<div class="register-container">
  <app-form-card>
    <h2>Registrar Cliente</h2>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" [(ngModel)]="nombre" name="nombre" placeholder="Tu nombre" />
      </div>
      <div class="form-group">
        <label>Apellido</label>
        <input type="text" [(ngModel)]="apellido" name="apellido" placeholder="Tu apellido" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="tu@email.com" />
      </div>
      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" [(ngModel)]="telefono" name="telefono" placeholder="09X XXX XXX" />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="contrasena" name="contrasena" placeholder="••••••••" />
      </div>
      <app-submit-button label="Registrarse" />
      <app-cancel-button (cancelled)="onCancelled()" />
    </form>
    <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
    <p *ngIf="successMessage" class="success-message">{{ successMessage }}</p>
  </app-form-card>
</div>
