<div class="edit-container">
  <app-form-card>
    <h2>Modificar Usuario</h2>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" [(ngModel)]="nombre" name="nombre" placeholder="Tu nombre" />
      </div>
      <div class="form-group">
        <label>Apellido</label>
        <input type="text" [(ngModel)]="apellido" name="apellido" placeholder="Tu apellido" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="tu@email.com" />
      </div>
      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" [(ngModel)]="telefono" name="telefono" placeholder="+598 09X XXX XXX" />
      </div>
      <div class="form-group">
        <label>Rol</label>
        <select [(ngModel)]="rol" name="rol">
          <option value="">Seleccioná un rol</option>
          <option *ngFor="let r of roles" [value]="r.value">{{ r.label }}</option>
        </select>
      </div>

      <app-submit-button label="Guardar cambios" />
      <app-cancel-button (cancelled)="onCancelled()" />
    </form>
    <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>

  </app-form-card>
</div>
