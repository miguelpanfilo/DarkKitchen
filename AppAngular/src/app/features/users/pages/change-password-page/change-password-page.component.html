<div class="d-flex justify-content-center pt-4">
  <app-form-card>
    <h1>Cambiar Contraseña</h1>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="contrasenaActual">Contraseña actual</label>
        <app-password-input inputId="contrasenaActual" name="contrasenaActual" [(value)]="contrasenaActual" [hasError]="submitted && !contrasenaActual.trim()" />
        <small *ngIf="submitted && !contrasenaActual.trim()" class="field-error">La contraseña actual es obligatoria.</small>
      </div>
      <div class="form-group">
        <label for="contrasenaNueva">Nueva contraseña</label>
        <app-password-input inputId="contrasenaNueva" name="contrasenaNueva" [(value)]="contrasenaNueva" [hasError]="submitted && !contrasenaNueva.trim()" />
        <small *ngIf="submitted && !contrasenaNueva.trim()" class="field-error">La nueva contraseña es obligatoria.</small>
        <small class="field-hint">Entre 15 y 25 caracteres. Debe incluir mayúscula, minúscula, número y carácter especial. Sin dos números consecutivos.</small>
      </div>
      <div class="form-group">
        <label for="confirmarContrasena">Confirmar contraseña</label>
        <app-password-input inputId="confirmarContrasena" name="confirmarContrasena" [(value)]="confirmarContrasena" [hasError]="submitted && !confirmarContrasena.trim()" />
        <small *ngIf="submitted && !confirmarContrasena.trim()" class="field-error">Debe confirmar la contraseña.</small>
      </div>
      <app-submit-button label="Cambiar contraseña" [disabled]="isLoading" />
      <app-cancel-button (cancelled)="onCancelled()" />
    </form>
    <app-status-messages [errorMessage]="errorMessage" [successMessage]="successMessage" />
  </app-form-card>
</div>
