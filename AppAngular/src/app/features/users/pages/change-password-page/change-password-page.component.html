<div class="change-password-container">
  <app-form-card>
    <h2>Cambiar Contraseña</h2>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Contraseña actual</label>
        <input type="password" [(ngModel)]="contrasenaActual" name="contrasenaActual" placeholder="••••••••" />
      </div>
      <div class="form-group">
        <label>Nueva contraseña</label>
        <input type="password" [(ngModel)]="contrasenaNueva" name="contrasenaNueva" placeholder="••••••••" />
      </div>
      <div class="form-group">
        <label>Confirmar contraseña</label>
        <input type="password" [(ngModel)]="confirmarContrasena" name="confirmarContrasena" placeholder="••••••••" />
      </div>
      <app-submit-button label="Cambiar contraseña" />
      <app-cancel-button (cancelled)="onCancelled()" />
    </form>
    <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
    <p *ngIf="successMessage" class="success-message">{{ successMessage }}</p>
  </app-form-card>
</div>
