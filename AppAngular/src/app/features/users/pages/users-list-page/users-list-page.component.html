<div class="users-container">
  <div class="users-header">
    <h2>Usuarios</h2>
    <app-add-button label="Agregar usuario" (clicked)="onAdd()" />
  </div>

  <div class="filters">
    <div class="form-group">
      <label>Nombre</label>
      <input type="text" [(ngModel)]="filterName" name="filterName" placeholder="Buscar por nombre" />
    </div>
    <div class="form-group">
      <label>Apellido</label>
      <input type="text" [(ngModel)]="filterLastName" name="filterLastName" placeholder="Buscar por apellido" />
    </div>
    <app-filter-button (filtered)="onFiltrar()" />
    <app-clear-button (cleared)="onLimpiar()" />
  </div>

  <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
  <p *ngIf="successMessage" class="success-message">{{ successMessage }}</p>
  <p *ngIf="users.length === 0" class="empty">No hay usuarios para mostrar.</p>
  <div *ngIf="users.length > 0" class="users-list">
    <app-user-card
      *ngFor="let user of users"
      [user]="user"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
      (changePassword)="onChangePassword($event)" />
  </div>

  <app-confirm-dialog
    [message]="'¿Estás seguro que querés eliminar al usuario ' + userToDelete?.name + ' ' + userToDelete?.lastName + '?'"
    [visible]="showConfirmDialog"
    (confirmed)="onConfirmDelete()"
    (cancelled)="onCancelDelete()" />
</div>
