<div class="register-container">
  <app-form-card>
    <h2>Registrar Usuario Interno</h2>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" [(ngModel)]="nombre" name="nombre" placeholder="Pedro" />
      </div>
      <div class="form-group">
        <label>Apellido</label>
        <input type="text" [(ngModel)]="apellido" name="apellido" placeholder="Pérez" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="pedroperez@email.com" />
      </div>
      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" [(ngModel)]="telefono" name="telefono" placeholder="09X XXX XXX" />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="contrasena" name="contrasena" placeholder="*************" />
      </div>
      <div class="form-group">
        <label>Rol</label>
        <select [(ngModel)]="rol" name="rol">
          <option value="">Seleccioná un rol</option>
          <option *ngFor="let role of roles" [value]="role.value">{{ role.label }}</option>
        </select>
      </div>
      <app-submit-button label="Registrar" />
      <app-cancel-button (cancelled)="onCancelled()" />
    </form>
    <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
    <p *ngIf="successMessage" class="success-message">{{ successMessage }}</p>
  </app-form-card>
</div>
