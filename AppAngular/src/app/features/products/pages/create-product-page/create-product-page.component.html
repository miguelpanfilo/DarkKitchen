<div class="create-container">
  <div class="create-header">
    <h1>Nuevo Producto</h1>
  </div>

  <app-status-messages
    [errorMessage]="errorMessage"
    [isLoading]="isSubmitting"
    loadingText="Creando producto..." />

  <div class="form-card">
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="code">Código *</label>
        <input id="code" type="text" [(ngModel)]="code" name="code" placeholder="Ej: PROD-001" />
      </div>
      <div class="form-group">
        <label for="name">Nombre *</label>
        <input id="name" type="text" [(ngModel)]="name" name="name" placeholder="Nombre del producto" />
      </div>
      <div class="form-group">
        <label for="description">Descripción *</label>
        <input id="description" type="text" [(ngModel)]="description" name="description" placeholder="Descripción breve" />
      </div>
      <div class="form-group">
        <label for="commercialLine">Línea comercial *</label>
        <input id="commercialLine" type="text" [(ngModel)]="commercialLine" name="commercialLine" placeholder="Ej: Bebidas" />
      </div>
      <div class="form-group">
        <label for="category">Categoría *</label>
        <input id="category" type="text" [(ngModel)]="category" name="category" placeholder="Ej: Sin alcohol" />
      </div>
      <div class="form-group">
        <label for="price">Precio *</label>
        <input id="price" type="number" [(ngModel)]="price" name="price" min="0.01" step="0.01" placeholder="0.00" />
      </div>

      <app-submit-button label="Crear Producto" [disabled]="isSubmitting" />
      <app-cancel-button (cancelled)="onCancel()" />
    </form>
  </div>
</div>
