<div class="edit-container">
    <div class="edit-header">
      <h2>Editar Producto</h2>
    </div>

    <app-status-messages
      [errorMessage]="errorMessage"
      [isLoading]="isLoading || isSubmitting"
      loadingText="{{ isLoading ? 'Cargando producto...' :
  'Guardando...' }}" />

    <div *ngIf="!isLoading" class="form-card">
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Código *</label>
          <input type="text" [(ngModel)]="code" name="code" />
        </div>
        <div class="form-group">
          <label>Nombre *</label>
          <input type="text" [(ngModel)]="name" name="name" />
        </div>
        <div class="form-group">
          <label>Descripción *</label>
          <input type="text" [(ngModel)]="description" name="description" />
        </div>
        <div class="form-group">
          <label>Línea comercial *</label>
          <input type="text" [(ngModel)]="commercialLine" name="commercialLine" />
        </div>
        <div class="form-group">
          <label>Categoría *</label>
          <input type="text" [(ngModel)]="category" name="category" />
        </div>
        <div class="form-group">
          <label>Precio *</label>
          <input type="number" [(ngModel)]="price" name="price" min="0.01" step="0.01" />
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" [(ngModel)]="isActive" name="isActive" />
            Activo
          </label>
        </div>

        <app-submit-button label="Guardar cambios" [disabled]="isSubmitting" />
        <app-cancel-button (cancelled)="onCancel()" />
      </form>
    </div>
  </div>
