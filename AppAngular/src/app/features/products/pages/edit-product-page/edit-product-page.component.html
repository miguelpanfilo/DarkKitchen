<div class="edit-container">
  <app-form-card>
    <h1>Editar Producto</h1>

    <app-status-messages
      [errorMessage]="errorMessage"
      [isLoading]="isLoading || isSubmitting"
      [loadingText]="isLoading ? 'Cargando producto...' : 'Guardando...'" />

    <form *ngIf="!isLoading" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="code">Código *</label>
        <input id="code" type="text" [(ngModel)]="code" name="code"
          [class.input-error]="submitted && !code.trim()" />
        <small *ngIf="submitted && !code.trim()" class="field-error">El código es obligatorio.</small>
      </div>
      <div class="form-group">
        <label for="name">Nombre *</label>
        <input id="name" type="text" [(ngModel)]="name" name="name"
          [class.input-error]="submitted && !name.trim()" />
        <small *ngIf="submitted && !name.trim()" class="field-error">El nombre es obligatorio.</small>
      </div>
      <div class="form-group">
        <label for="description">Descripción *</label>
        <input id="description" type="text" [(ngModel)]="description" name="description"
          [class.input-error]="submitted && !description.trim()" />
        <small *ngIf="submitted && !description.trim()" class="field-error">La descripción es obligatoria.</small>
      </div>
      <div class="form-group">
        <label for="commercialLine">Línea comercial *</label>
        <input id="commercialLine" type="text" [(ngModel)]="commercialLine" name="commercialLine"
          [class.input-error]="submitted && !commercialLine.trim()" />
        <small *ngIf="submitted && !commercialLine.trim()" class="field-error">La línea comercial es obligatoria.</small>
      </div>
      <div class="form-group">
        <label for="category">Categoría *</label>
        <input id="category" type="text" [(ngModel)]="category" name="category"
          [class.input-error]="submitted && !category.trim()" />
        <small *ngIf="submitted && !category.trim()" class="field-error">La categoría es obligatoria.</small>
      </div>
      <div class="form-group">
        <label for="price">Precio *</label>
        <input id="price" type="number" [(ngModel)]="price" name="price" min="0.01" step="0.01"
          [class.input-error]="submitted && (price === null || price <= 0)" />
        <small *ngIf="submitted && (price === null || price <= 0)" class="field-error">El precio debe ser mayor a cero.</small>
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" [(ngModel)]="isActive" name="isActive" />
          Activo
        </label>
      </div>

      <div class="form-group">
        <label for="photos">Fotos (1 a 3, solo JPG, máx. 500 KB c/u)</label>
        <input id="photos" type="file" accept=".jpg,.jpeg" (change)="onPhotosSelected($event)"
          [disabled]="photos.length >= 3" />
        <small *ngIf="submitted && photos.length === 0" class="field-error">El producto debe tener al menos una foto.</small>
      </div>

      <div *ngIf="photos.length > 0" class="photos-list">
        <div *ngFor="let photo of photos; let i = index" class="photo-item">
          <span class="photo-name">{{ getPhotoLabel(photo) }}</span>
          <button type="button" class="btn-remove-photo" (click)="removePhoto(i)">✕</button>
        </div>
      </div>

      <app-submit-button label="Guardar cambios" [disabled]="isSubmitting" />
      <app-cancel-button (cancelled)="onCancel()" />
    </form>
  </app-form-card>
</div>
