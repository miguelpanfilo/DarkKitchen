<div class="products-container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Productos</h1>
    <div class="d-flex gap-2">
      <app-add-button
        *appHasRole="['Administrative']"
        label="Importar productos"
        (clicked)="onImport()" />

      <app-add-button
        *appHasRole="['Administrative']"
        label="Nuevo producto"
        (clicked)="onAdd()" />
    </div>
  </div>

  <div class="filters d-flex gap-3 align-items-end flex-wrap">
    <div class="form-group">
      <label for="filterName">Nombre</label>
      <input id="filterName" type="text" [(ngModel)]="filterName" name="filterName" placeholder="Buscar por nombre" />
    </div>
    <div class="form-group">
      <label for="filterCommercialLine">Línea comercial</label>
      <input id="filterCommercialLine" type="text" [(ngModel)]="filterCommercialLine" name="filterCommercialLine" placeholder="Buscar por línea" />
    </div>
    <div class="form-group">
      <label for="filterCategory">Categoría</label>
      <input id="filterCategory" type="text" [(ngModel)]="filterCategory" name="filterCategory" placeholder="Buscar por categoría" />
    </div>
    <app-filter-button (filtered)="onFiltrar()" />
    <app-clear-button (cleared)="onLimpiar()" />
  </div>

  <app-status-messages [errorMessage]="errorMessage" [successMessage]="successMessage"
    [isLoading]="isLoading" loadingText="Cargando productos..." />

  <p *ngIf="!isLoading && products.length === 0 && !errorMessage" class="empty">No hay productos para mostrar.</p>

  <div *ngIf="products.length > 0" class="products-grid">
    <app-product-card *ngFor="let product of products" [product]="product"
      (edit)="onEdit($event)" (delete)="onDelete($event)" />
  </div>
</div>

<app-confirm-dialog message="¿Estás seguro que querés eliminar este producto?"
  [visible]="showConfirmDialog" (confirmed)="onConfirmDelete()" (cancelled)="onCancelDelete()" />
