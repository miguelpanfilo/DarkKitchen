<div class="shipping-container">
  <div class="shipping-header">
    <h1>Tipos de Envío</h1>
  </div>

  <app-status-messages
    [errorMessage]="errorMessage"
    [successMessage]="successMessage"
    [isLoading]="isLoading"
    loadingText="Cargando tipos de envío..." />

  <div class="section-card create-form">
    <h2>Nuevo tipo de envío</h2>
    <div class="form-row">
      <div class="form-group">
        <label for="newName">Nombre</label>
        <input id="newName" type="text" [(ngModel)]="newName" name="newName" placeholder="Ej: Envío express" />
      </div>
      <div class="form-group cost-group">
        <label for="newCost">Costo ($)</label>
        <input id="newCost" type="number" [(ngModel)]="newCost" name="newCost" min="0" step="0.01" placeholder="0.00" />
      </div>
      <button class="btn btn-primary" (click)="onCreate()" [disabled]="isCreating">
        {{ isCreating ? 'Creando...' : 'Agregar' }}
      </button>
    </div>
  </div>

  <div *ngIf="!isLoading && shippingTypes.length === 0 && !errorMessage" class="empty">
    No hay tipos de envío registrados.
  </div>

  <div *ngIf="shippingTypes.length > 0" class="types-list">
    <div *ngFor="let type of shippingTypes" class="type-card">

      <div *ngIf="editingId !== type.id" class="type-view">
        <div class="type-info">
          <span class="type-name">{{ type.name }}</span>
          <span class="type-cost">${{ type.cost | number:'1.2-2' }}</span>
        </div>
        <app-edit-button (clicked)="onEdit(type)" />
      </div>

      <div *ngIf="editingId === type.id" class="type-edit">
        <div class="form-row">
          <div class="form-group">
            <label for="editName">Nombre</label>
            <input id="editName" type="text" [(ngModel)]="editName" name="editName" />
          </div>
          <div class="form-group cost-group">
            <label for="editCost">Costo ($)</label>
            <input id="editCost" type="number" [(ngModel)]="editCost" name="editCost" min="0" step="0.01" />
          </div>
          <div class="edit-actions">
            <button class="btn btn-primary" (click)="onSaveEdit(type)" [disabled]="isSaving">
              {{ isSaving ? 'Guardando...' : 'Guardar' }}
            </button>
            <button class="btn btn-outline" (click)="onCancelEdit()" [disabled]="isSaving">Cancelar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
