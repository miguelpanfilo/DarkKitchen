<app-form-card>
  <h1>Iniciar sesión</h1>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group mb-3">
      <label for="email">Email</label>
      <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="tu@email.com" />
    </div>
    <div class="form-group mb-3">
      <label for="contrasena">Contraseña</label>
      <input id="contrasena" type="password" [(ngModel)]="contrasena" name="contrasena" placeholder="••••••••" />
    </div>
    <app-submit-button label="Entrar" [disabled]="isLoading" />
    <app-cancel-button (cancelled)="onCancelled()" />
  </form>
  <app-status-messages [errorMessage]="errorMessage" [successMessage]="successMessage" />
</app-form-card>
