<div class="login-container">
  <app-form-card>
    <h2>Iniciar sesión</h2>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="tu@email.com" />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="contrasena" name="contrasena" placeholder="••••••••" />
      </div>
      <app-submit-button label="Entrar" [disabled]="isLoading" /> <app-cancel-button (cancelled)="onCancelled()" />
    </form>
    <app-status-messages [errorMessage]="errorMessage" [successMessage]="successMessage" />
  </app-form-card>
</div>
