services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge
    container_name: sqlserver
    environment:
      SA_PASSWORD: "Passw1rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "5254:5254"
    environment:
      - ASPNETCORE_URLS=http://+:5254
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=DarkKitchenDb;User Id=sa;Password=Passw1rd;TrustServerCertificate=True;Encrypt=False;
      - PhotoStorage__Path=/app/photos
    depends_on:
      - sqlserver
    restart: unless-stopped

volumes:
  sql_data:
